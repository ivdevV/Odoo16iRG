events {
    worker_connections  1024;
}

http {
    server_tokens off;
    charset utf-8;
    resolver 127.0.0.11 valid=30s; # DNS interno de Docker

    # Servidor para redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name rd.institutoraimongaja.com; # ¡Tu dominio real!
        return 301 https://$host$request_uri; # Redirecciona a HTTPS
    }

    # Servidor para HTTPS
    server {
        listen 443 ssl;
        server_name rd.institutoraimongaja.com; # ¡Tu dominio real!

        ssl_certificate /etc/letsencrypt/live/rd.institutoraimongaja.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rd.institutoraimongaja.com/privkey.pem;

        # Elige una de estas opciones:
        # Opción A: Descomenta estas líneas SOLAMENTE si los archivos existen en /home/ubuntu/minicrm/certbot/conf/
        # include /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Opción B: Si los archivos NO existen (lo más probable), usa estas configuraciones SSL básicas:
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://web:5000; # Pasa directamente a tu app Flask
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # IMPORTANTE: indica a la app que es HTTPS
        }

        # Bloque para la verificación de Certbot (MANTENER para futuras renovaciones)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Puedes mantener esto si montas la carpeta de imágenes y quieres probarla
        location /imagenes/ {
            alias /home/ubuntu/minicrm/imagenes/;
            autoindex off;
        }
    }
}